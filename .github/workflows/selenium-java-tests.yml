name: Selenium Java CI
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
jobs:
  selenium-test:
    name: Run Selenium Java Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui-automation/selenium-java
    env:
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'WARN' }}
      LOG_DIR: ${{ vars.LOG_DIR || 'target/logs' }}
      LOG_CONSOLE_ENABLED: ${{ vars.LOG_CONSOLE_ENABLED || 'true' }}
      LOG_FILE_ENABLED: ${{ vars.LOG_FILE_ENABLED || 'true' }}
      ENV: ${{ vars.ENV || 'QA' }}
      BROWSER: ${{ vars.BROWSER || 'chrome' }}
      BASE_URL: ${{ secrets.BASE_URL }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify Java version
        run: java -version

      - name: Set up Chrome and ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable          # or pin to e.g. '124' for reproducibility
          install-dependencies: true      # auto-installs required system libs on Linux
 
      - name: Verify browser versions
        run: |
          ${{ steps.setup-chrome.outputs.chrome-path }} --version

      - name: Start Xvfb virtual display
        run: |
            sudo apt-get install -y xvfb
            Xvfb :99 -screen 0 1920x1080x24 &
            sleep 2

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        env:
          SAUCEDEMO_USERNAME: ${{ secrets.SAUCEDEMO_STANDARD_USERNAME }}
          SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_STANDARD_PASSWORD }}
        run: mvn clean test -DsuiteXmlFile=testng.xml
        continue-on-error: true

      - name: Generate Allure report
        if: always()
        run: mvn allure:report
        
      - name: Upload Allure report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-${{ github.run_number }}
          path: ui-automation/selenium-java/target/allure-report
          retention-days: 30
