name: Selenium Java CI
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
jobs:
  selenium-test:
    name: Run Selenium Java Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui-automation/selenium-java
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Verify Java version
        run: java -version

      - name: Set up Chrome and ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable          # or pin to e.g. '124' for reproducibility
          install-chromedriver: true
          install-dependencies: true      # auto-installs required system libs on Linux
 
      - name: Verify browser versions
        run: |
          ${{ steps.setup-chrome.outputs.chrome-path }} --version
          ${{ steps.setup-chrome.outputs.chromedriver-path }} --version

      - name: Start Xvfb virtual display
        run: |
            sudo apt-get install -y xvfb
            Xvfb :99 -screen 0 1920x1080x24 &
            sleep 2

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Tests
        env:
          SAUCEDEMO_USERNAME: ${{ secrets.SAUCEDEMO_STANDARD_USERNAME }}
          SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_STANDARD_PASSWORD }}
        run: mvn test 
